<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#007aff">
<title>Watermark</title>
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #fff; color: #1c1c1e;
  max-width: 420px; margin: 0 auto; padding: 16px;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; cursor: pointer; border: none; background: none; }

/* PIN screen */
#pin-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 80vh; gap: 16px;
}
#pin-screen h1 { font-size: 24px; }
#pin-input {
  font-size: 24px; text-align: center; width: 160px;
  padding: 8px; border: 2px solid #ccc; border-radius: 10px;
  -webkit-text-security: disc;
}
#pin-submit {
  font-size: 18px; padding: 10px 32px;
  background: #007aff; color: #fff; border-radius: 10px;
}
#pin-error { color: #ff3b30; font-size: 14px; display: none; }

/* App */
#app { display: none; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.header .nav-btn { font-size: 24px; padding: 8px; color: #007aff; }
.header .center { text-align: center; }
.header .date-label { font-size: 18px; font-weight: 700; }
.header .today-link {
  font-size: 13px; color: #007aff; background: none; border: none;
  cursor: pointer; margin-top: 2px;
}

/* Top bar */
.top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.logout-btn { font-size: 13px; color: #007aff; }

/* Calendar */
.calendar-row { margin-bottom: 16px; }
.calendar-row input[type="date"] {
  width: 100%; font-size: 16px; padding: 8px;
  border: 1px solid #c7c7cc; border-radius: 10px;
}

/* Notes */
textarea {
  width: 100%; min-height: 120px; font-size: 16px;
  padding: 10px; border: 1px solid #c7c7cc; border-radius: 10px;
  resize: vertical; font-family: inherit;
}

/* Score buttons */
.scores {
  display: flex; justify-content: center; gap: 10px;
  margin-top: 16px; padding-bottom: 24px;
}
.score-btn {
  width: 48px; height: 48px; font-size: 20px;
  border-radius: 10px; background: #e5e5ea; color: #1c1c1e;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.score-btn.active { background: #007aff; color: #fff; }

/* Status */
.status {
  text-align: center; font-size: 12px; color: #8e8e93;
  min-height: 18px; margin-top: 8px;
}
</style>
</head>
<body>

<!-- PIN Screen -->
<div id="pin-screen">
  <h1>Watermark</h1>
  <input id="pin-input" type="tel" inputmode="numeric" placeholder="PIN">
  <button id="pin-submit" type="button">Enter</button>
  <div id="pin-error">Invalid PIN. Try again.</div>
</div>

<!-- Main App -->
<div id="app">
  <div class="top-bar">
    <button class="logout-btn" id="logout-btn">Logout</button>
  </div>

  <div class="header">
    <button class="nav-btn" id="prev-btn">&#8249;</button>
    <div class="center">
      <div class="date-label" id="date-label"></div>
      <button class="today-link" id="today-btn" style="display:none">Today</button>
    </div>
    <button class="nav-btn" id="next-btn">&#8250;</button>
  </div>

  <div class="calendar-row">
    <input type="date" id="date-picker">
  </div>

  <textarea id="notes" placeholder="Notes..."></textarea>

  <div class="scores" id="scores"></div>
  <div class="status" id="status"></div>
</div>

<script>
(function () {
  // --- Config ---
  const API_URL = localStorage.getItem("wm_api_url") || "";

  // --- Elements ---
  const pinScreen  = document.getElementById("pin-screen");
  const pinInput   = document.getElementById("pin-input");
  const pinSubmit  = document.getElementById("pin-submit");
  const pinError   = document.getElementById("pin-error");
  const app        = document.getElementById("app");
  const dateLabel  = document.getElementById("date-label");
  const todayBtn   = document.getElementById("today-btn");
  const prevBtn    = document.getElementById("prev-btn");
  const nextBtn    = document.getElementById("next-btn");
  const datePicker = document.getElementById("date-picker");
  const notesEl    = document.getElementById("notes");
  const scoresEl   = document.getElementById("scores");
  const statusEl   = document.getElementById("status");
  const logoutBtn  = document.getElementById("logout-btn");

  let selectedDate = today();
  let currentScore = null;
  let debounceTimer = null;

  // --- Date helpers ---
  function today() {
    const d = new Date();
    return fmtDate(d);
  }
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function parseLocal(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function shiftDay(dateStr, delta) {
    const d = parseLocal(dateStr);
    d.setDate(d.getDate() + delta);
    return fmtDate(d);
  }
  function formatLabel(dateStr) {
    const d = parseLocal(dateStr);
    return d.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
  }

  // --- PIN ---
  function getPin() { return localStorage.getItem("wm_pin"); }
  function setPin(p) { localStorage.setItem("wm_pin", p); }
  function clearPin() { localStorage.removeItem("wm_pin"); }

  function showApp() {
    pinScreen.style.display = "none";
    app.style.display = "block";
    buildScoreButtons();
    goToDate(selectedDate);
  }

  pinSubmit.addEventListener("click", tryPin);
  pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryPin(); });

  function tryPin() {
    const pin = pinInput.value.trim();
    if (!pin) return;
    pinError.style.display = "none";
    statusEl.textContent = "";
    // Validate by making a test GET request
    fetchEntries(pin)
      .then(() => { setPin(pin); showApp(); })
      .catch(() => { pinError.style.display = "block"; });
  }

  logoutBtn.addEventListener("click", () => {
    clearPin();
    app.style.display = "none";
    pinScreen.style.display = "flex";
    pinInput.value = "";
    pinError.style.display = "none";
  });

  // --- Navigation ---
  prevBtn.addEventListener("click", () => goToDate(shiftDay(selectedDate, -1)));
  nextBtn.addEventListener("click", () => goToDate(shiftDay(selectedDate, 1)));
  todayBtn.addEventListener("click", () => goToDate(today()));
  datePicker.addEventListener("change", () => goToDate(datePicker.value));

  function goToDate(dateStr) {
    selectedDate = dateStr;
    dateLabel.textContent = formatLabel(dateStr);
    datePicker.value = dateStr;
    todayBtn.style.display = dateStr === today() ? "none" : "inline";
    loadEntry();
  }

  // --- Score buttons ---
  function buildScoreButtons() {
    scoresEl.innerHTML = "";
    for (let i = 0; i <= 5; i++) {
      const btn = document.createElement("button");
      btn.className = "score-btn";
      btn.textContent = i;
      btn.dataset.value = i;
      btn.addEventListener("click", () => onScoreTap(i));
      scoresEl.appendChild(btn);
    }
  }

  function onScoreTap(value) {
    if (currentScore === value) {
      currentScore = null;
    } else {
      currentScore = value;
    }
    updateScoreUI();
    save();
  }

  function updateScoreUI() {
    scoresEl.querySelectorAll(".score-btn").forEach((btn) => {
      const v = parseInt(btn.dataset.value);
      btn.classList.toggle("active", v === currentScore);
    });
  }

  // --- Notes ---
  notesEl.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(save, 600);
  });

  // --- API ---
  function fetchEntries(pin) {
    const p = pin || getPin();
    return fetch(API_URL + "?pin=" + p)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) throw new Error(data.error);
        return data;
      });
  }

  function loadEntry() {
    statusEl.textContent = "Loading...";
    fetchEntries()
      .then((rows) => {
        const entry = rows.find((r) => r.date === selectedDate);
        if (entry) {
          currentScore = entry.score === "" || entry.score == null ? null : Number(entry.score);
          notesEl.value = entry.notes || "";
        } else {
          currentScore = null;
          notesEl.value = "";
        }
        updateScoreUI();
        statusEl.textContent = "";
      })
      .catch((err) => {
        statusEl.textContent = "Error loading data";
        console.error(err);
      });
  }

  function save() {
    statusEl.textContent = "Saving...";
    const body = {
      pin: getPin(),
      date: selectedDate,
      score: currentScore,
      notes: notesEl.value,
    };
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.error) throw new Error(data.error);
        statusEl.textContent = "Saved";
        setTimeout(() => { if (statusEl.textContent === "Saved") statusEl.textContent = ""; }, 1500);
      })
      .catch((err) => {
        statusEl.textContent = "Error saving";
        console.error(err);
      });
  }

  // --- Init ---
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }

  if (!API_URL) {
    const url = prompt("Enter your Apps Script deployment URL:");
    if (url) {
      localStorage.setItem("wm_api_url", url.trim());
      location.reload();
    }
  } else if (getPin()) {
    showApp();
  }
})();
</script>
</body>
</html>
